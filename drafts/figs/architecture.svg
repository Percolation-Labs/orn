<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
  <!-- Makes the "per-layer everything" vs "shared coupling, per-layer response"
       contrast visible: left panel shows L stacked copies of the FULL attention
       block; right panel shows ONE shared M at the top feeding L response-only
       blocks. -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <style>
    .title  { font-size: 17px; font-weight: 600; fill: #111827; }
    .ptitle { font-size: 14px; font-weight: 600; fill: #111827; }
    .psub   { font-size: 11.5px; fill: #4b5563; }
    .block  { stroke-width: 1.1; filter: url(#soft); }
    .btxt   { font-size: 12.5px; font-weight: 600; fill: #1f2937; }
    .sub    { font-size: 10px; fill: #4b5563; }
    .mono   { font-family: "JetBrains Mono", Menlo, Monaco, monospace; font-size: 10.5px; }
    .Lcount { font-size: 15px; font-weight: 700; fill: #ef4444; }
    .label  { font-size: 11px; fill: #6b7280; }
    .pcost  { font-size: 11.5px; fill: #374151; font-style: italic; }
    .stream { stroke: #4b5563; stroke-width: 1.2; fill: none; }
  </style>

  <text x="490" y="28" class="title" text-anchor="middle">
    Decomposing attention: what to share, what to keep per-layer
  </text>

  <!-- ========================================================= -->
  <!-- LEFT: Standard transformer — everything lives per layer    -->
  <!-- ========================================================= -->
  <g>
    <rect x="40" y="50" width="420" height="560" rx="10" ry="10"
          fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="250" y="76" class="ptitle" text-anchor="middle">Standard transformer</text>
    <text x="250" y="94" class="psub"   text-anchor="middle">
      each of L layers stores its own W_Q, W_K, V, O, FFN
    </text>

    <!-- x (residual in) -->
    <text x="250" y="120" class="label" text-anchor="middle">residual stream x</text>
    <line class="stream" x1="250" y1="128" x2="250" y2="150" marker-end="url(#arrow)"/>

    <!-- Three offset stacked layer boxes to suggest "xL" -->
    <g id="tf-stack">
      <!-- back -->
      <rect class="block" x="98" y="166" width="304" height="280" rx="8"
            fill="#fef9e7" stroke="#f59e0b"/>
      <rect class="block" x="92" y="160" width="304" height="280" rx="8"
            fill="#fef9e7" stroke="#f59e0b"/>
      <!-- front -->
      <rect class="block" x="86" y="154" width="304" height="280" rx="8"
            fill="#fef9e7" stroke="#f59e0b"/>

      <text x="238" y="180" class="btxt" text-anchor="middle">Layer ℓ</text>

      <!-- inside front layer -->
      <rect x="108" y="196" width="260" height="46" rx="5"
            fill="#ffe8b3" stroke="#d97706"/>
      <text x="238" y="214" class="btxt" text-anchor="middle">W_Q, W_K   (per layer)</text>
      <text x="238" y="232" class="sub"  text-anchor="middle">
        defines this layer's coupling M_ℓ = W_Qᵀ W_K
      </text>

      <rect x="108" y="250" width="260" height="36" rx="5"
            fill="#fff8e1" stroke="#d97706"/>
      <text x="238" y="272" class="btxt" text-anchor="middle">Attention softmax</text>

      <rect x="108" y="294" width="260" height="36" rx="5"
            fill="#ffe8b3" stroke="#d97706"/>
      <text x="238" y="316" class="btxt" text-anchor="middle">W_V, W_O   (per layer)</text>

      <rect x="108" y="338" width="260" height="36" rx="5"
            fill="#ffe8b3" stroke="#d97706"/>
      <text x="238" y="360" class="btxt" text-anchor="middle">FFN   (per layer)</text>

      <rect x="108" y="382" width="260" height="32" rx="5"
            fill="#fef3c7" stroke="#d97706"/>
      <text x="238" y="402" class="btxt" text-anchor="middle">Add &amp; Norm</text>
    </g>

    <!-- ×L label on the right of the stack -->
    <text x="415" y="300" class="Lcount" text-anchor="middle">× L</text>
    <line x1="405" y1="170" x2="405" y2="430" stroke="#ef4444" stroke-width="1.2"/>
    <polyline points="401,170 405,162 409,170" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <polyline points="401,430 405,438 409,430" fill="none" stroke="#ef4444" stroke-width="1.2"/>

    <!-- parameter cost caption -->
    <text x="250" y="470" class="pcost" text-anchor="middle">
      coupling parameters: O( L · d² )
    </text>
    <text x="250" y="490" class="psub" text-anchor="middle">
      every layer relearns its own coupling rule
    </text>

    <line class="stream" x1="250" y1="510" x2="250" y2="544" marker-end="url(#arrow)"/>
    <text x="250" y="562" class="label" text-anchor="middle">next layer (or logits)</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT: ORN — one shared M up top, L response-only layers   -->
  <!-- ========================================================= -->
  <g>
    <rect x="510" y="50" width="430" height="560" rx="10" ry="10"
          fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <text x="725" y="76" class="ptitle" text-anchor="middle">Orbital Response Network</text>
    <text x="725" y="94" class="psub"   text-anchor="middle">
      one shared coupling M = ABᵀ, L copies of response only
    </text>

    <text x="725" y="120" class="label" text-anchor="middle">residual stream x</text>
    <line class="stream" x1="725" y1="128" x2="725" y2="150" marker-end="url(#arrow)"/>

    <!-- Shared M block — drawn distinctively, outside the per-layer stack -->
    <rect class="block" x="575" y="154" width="300" height="66" rx="8"
          fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="725" y="176" class="btxt" text-anchor="middle" fill="#1e3a8a">
      Shared M = A Bᵀ
    </text>
    <text x="725" y="194" class="sub"  text-anchor="middle" fill="#1e40af">
      A, B live once, reused unchanged at every layer
    </text>
    <text x="725" y="210" class="mono" text-anchor="middle" fill="#1e3a8a">
      Q_ℓ = h_ℓ · A        K_ℓ = h_ℓ · B
    </text>

    <!-- curly brace / side note showing "one copy" -->
    <path d="M 553 154 C 547 154, 547 187, 541 187 C 547 187, 547 220, 553 220"
          fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="534" y="192" class="sub" text-anchor="end" fill="#1d4ed8">
      one copy
    </text>

    <!-- arrow from shared M down into the per-layer stack -->
    <line class="stream" x1="725" y1="224" x2="725" y2="254" marker-end="url(#arrow)"/>

    <!-- Response-only layer stack (three offset copies) -->
    <g>
      <rect class="block" x="608" y="270" width="276" height="182" rx="8"
            fill="#fff4eb" stroke="#ea580c"/>
      <rect class="block" x="602" y="264" width="276" height="182" rx="8"
            fill="#fff4eb" stroke="#ea580c"/>
      <rect class="block" x="596" y="258" width="276" height="182" rx="8"
            fill="#fff4eb" stroke="#ea580c"/>

      <text x="734" y="282" class="btxt" text-anchor="middle">Response layer ℓ</text>
      <text x="734" y="297" class="sub" text-anchor="middle" fill="#9a3412">
        reads shared M above; stores only response
      </text>

      <rect x="618" y="310" width="232" height="30" rx="5"
            fill="#ffe6cc" stroke="#c2410c"/>
      <text x="734" y="329" class="btxt" text-anchor="middle">W_V, W_O</text>

      <rect x="618" y="346" width="232" height="30" rx="5"
            fill="#ffe6cc" stroke="#c2410c"/>
      <text x="734" y="365" class="btxt" text-anchor="middle">FFN</text>

      <rect x="618" y="382" width="232" height="30" rx="5"
            fill="#ffe6cc" stroke="#c2410c"/>
      <text x="734" y="401" class="btxt" text-anchor="middle">Perturbative correction</text>

      <rect x="618" y="418" width="232" height="24" rx="5"
            fill="#fef3c7" stroke="#c2410c"/>
      <text x="734" y="434" class="btxt" text-anchor="middle" font-size="11">Add &amp; Norm</text>
    </g>

    <text x="898" y="352" class="Lcount" text-anchor="middle">× L</text>
    <line x1="888" y1="276" x2="888" y2="440" stroke="#ef4444" stroke-width="1.2"/>
    <polyline points="884,276 888,268 892,276" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <polyline points="884,440 888,448 892,440" fill="none" stroke="#ef4444" stroke-width="1.2"/>

    <text x="725" y="478" class="pcost" text-anchor="middle">
      coupling parameters: O( d² ), not O( L · d² )
    </text>
    <text x="725" y="498" class="psub" text-anchor="middle">
      the coupling rule is memoised once; only the response varies with depth
    </text>

    <line class="stream" x1="725" y1="516" x2="725" y2="544" marker-end="url(#arrow)"/>
    <text x="725" y="562" class="label" text-anchor="middle">next layer (or logits)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(275, 612)">
    <rect x="0"   y="-9" width="14" height="14" rx="2" fill="#fef9e7" stroke="#f59e0b"/>
    <text x="22" y="2" class="sub">per-layer (stored L times)</text>
    <rect x="195" y="-9" width="14" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="217" y="2" class="sub">shared (stored once)</text>
    <rect x="340" y="-9" width="14" height="14" rx="2" fill="#fff4eb" stroke="#ea580c"/>
    <text x="362" y="2" class="sub">per-layer response only (no coupling)</text>
  </g>
</svg>
