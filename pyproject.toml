[project]
name = "orn"
version = "0.2.0"
description = "Orbital Response Network — shared coupling geometry for transformers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "tiktoken>=0.5",
    "tqdm>=4.65",
]

[project.optional-dependencies]
data  = ["datasets>=2.14", "huggingface-hub>=0.16", "transformers>=4.36"]
eval  = ["lm-eval>=0.4"]
plots = ["plotly>=5.20", "kaleido>=0.2"]
dev   = ["pytest>=7.0", "ruff>=0.1"]
vast  = ["wandb>=0.15", "datasets>=2.14", "huggingface-hub>=0.16"]

[project.scripts]
orn = "orn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orn/src/orn"]

[tool.pytest.ini_options]
markers = [
    "reproduce: fast-tier reproducible key-result tests (run by default)",
    "slow_reproduce: slow-tier reproducible key-result tests (opt-in)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
